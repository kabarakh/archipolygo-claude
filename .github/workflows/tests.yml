name: Tests

# Runs on every push/PR so regressions surface immediately during ordinary
# development, and via workflow_call so release.yml can gate its publish
# job on the very same run instead of duplicating these steps - see
# Test-Umsetzungsplan.md's CI/CD section.
on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    name: dotnet test
    # ubuntu-latest, same reasoning as release.yml's build job: the tests
    # themselves need no Windows/macOS-specific behavior, and
    # Avalonia.Headless runs explicitly without a real display server - no
    # Xvfb or GUI-capable runner required.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test AvaloniaApplication1.sln
